<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel Takeoff — 3-4 Bourne Hill Close</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <div class="brand-mark">ST</div>
    <div>
      <div class="brand-title">Steel Takeoff Viewer</div>
      <div class="brand-sub" id="project-sub">—</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="chip chip-dim" id="chip-drawings"></span>
    <span class="chip chip-warn">AI-assisted · verify before order</span>
  </div>
</header>

<section id="kpis">
  <div class="kpi"><div class="kpi-label">Net steel</div><div class="kpi-value" id="kpi-net">—</div><div class="kpi-unit">tonnes</div></div>
  <div class="kpi"><div class="kpi-label">Order quantity</div><div class="kpi-value" id="kpi-order">—</div><div class="kpi-unit">incl. waste allowance</div></div>
  <div class="kpi"><div class="kpi-label">Quote</div><div class="kpi-value" id="kpi-quote">—</div><div class="kpi-unit" id="kpi-quote-sub">incl. OH&amp;P</div></div>
  <div class="kpi"><div class="kpi-label">Member marks</div><div class="kpi-value" id="kpi-marks">—</div><div class="kpi-unit">B1–B5, P1 + fittings</div></div>
  <div class="kpi kpi-warn"><div class="kpi-label">To verify</div><div class="kpi-value" id="kpi-verify">—</div><div class="kpi-unit">estimated / missing</div></div>
</section>

<main id="main">
  <section id="viewport-wrap">
    <div id="viewport-bar">
      <div class="tb-group">
        <span class="tb-label">Layers</span>
        <button class="tb-btn active" data-layer="sheet">2D sheet</button>
        <button class="tb-btn active" data-layer="model">3D model</button>
        <button class="tb-btn active" data-layer="marks">Markings</button>
        <button class="tb-btn" data-layer="text">Text</button>
        <button class="tb-btn active" data-layer="grid">Grid</button>
        <button class="tb-btn active" data-layer="conn">Connections</button>
      </div>
      <div class="tb-group">
        <span class="tb-label">Camera</span>
        <button class="tb-btn" data-cam="iso">Iso</button>
        <button class="tb-btn" data-cam="top">Top</button>
        <button class="tb-btn" data-cam="front">Front</button>
      </div>
      <div class="tb-spacer"></div>
      <span id="sel-info" class="sel-info">click a member or table row</span>
    </div>
    <div id="viewport"></div>
    <div id="member-card" class="hidden"></div>
  </section>

  <aside id="panel">
    <nav id="tabs">
      <button class="tab active" data-tab="schedule">Schedule</button>
      <button class="tab" data-tab="quote">Quote</button>
      <button class="tab" data-tab="procurement">Procurement</button>
      <button class="tab" data-tab="qa">QA</button>
    </nav>
    <div id="tab-schedule" class="tabpage active"></div>
    <div id="tab-quote" class="tabpage"></div>
    <div id="tab-procurement" class="tabpage"></div>
    <div id="tab-qa" class="tabpage"></div>
  </aside>
</main>

<footer id="footer">
  <span id="foot-src"></span>
  <span id="foot-gen"></span>
</footer>

<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<script type="module" src="app.js"></script>
</body>
</html>
